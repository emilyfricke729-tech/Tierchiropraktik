<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-label="Dennis Meyer – Ganzheitliche Pferdetherapie">
  <!--
    SVG-Nachbau des Logos von Dennis Meyer.
    Zeigt: Pferdekopf-Silhouette in einem Kreis mit Schwung-Linien.
    Wenn Sie Ihr Original-Logo als PNG/SVG haben, ersetzen Sie einfach
    diese Datei: bilder/logo.svg (oder bilder/logo.png).
  -->

  <!-- Äußerer Kreis-Schwung (hinten) -->
  <path d="M 20 95 Q 5 60 20 28 Q 40 5 70 8 Q 100 10 112 35 Q 122 58 108 82 Q 92 108 62 114 Q 35 118 20 95 Z"
        fill="none" stroke="#2D1845" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Innerer Schwung-Bogen -->
  <path d="M 28 88 Q 16 60 28 35 Q 46 14 72 16 Q 96 18 105 42 Q 113 64 98 84"
        fill="none" stroke="#2D1845" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Pferdekopf-Silhouette -->
  <!-- Hals -->
  <path d="M 48 95 L 52 70 Q 54 58 60 52" fill="#2D1845" stroke="none"/>
  <path d="M 58 95 L 60 72 Q 62 60 66 54" fill="#2D1845" stroke="none"/>

  <!-- Kopf-Umriss -->
  <path d="
    M 60 52
    Q 64 44 72 40
    Q 80 37 84 42
    Q 88 47 85 53
    Q 90 52 92 56
    Q 94 62 88 64
    Q 90 68 87 72
    Q 84 76 79 75
    Q 76 80 70 80
    Q 64 80 62 74
    Q 58 70 60 64
    Q 56 60 60 52 Z"
    fill="#2D1845"/>

  <!-- Mähne / Haare oben -->
  <path d="M 72 40 Q 76 30 80 25 Q 84 20 82 28 Q 86 22 86 30 Q 90 24 88 32 Q 85 36 84 42"
        fill="#2D1845" stroke="none"/>

  <!-- Auge (weiß) -->
  <ellipse cx="78" cy="53" rx="4" ry="3.5" fill="white"/>
  <circle cx="78" cy="53" r="2" fill="#2D1845"/>
  <circle cx="79" cy="52" r="0.7" fill="white"/>

  <!-- Nüstern -->
  <path d="M 82 68 Q 85 68 85 71 Q 85 73 82 73" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Hals-Füllung (verbindet Kopf mit Körper) -->
  <path d="M 48 95 L 52 70 Q 54 62 60 56 Q 62 54 64 54 Q 66 54 66 56 Q 64 62 62 72 L 58 95 Z"
        fill="#2D1845"/>

  <!-- Mähne am Hals -->
  <path d="M 54 68 Q 50 72 52 78 Q 50 74 48 80 Q 47 76 46 82"
        fill="none" stroke="#2D1845" stroke-width="2.5" stroke-linecap="round"/>
</svg>
